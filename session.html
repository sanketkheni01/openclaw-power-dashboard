<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session — OpenClaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cozy-theme.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="/cozy-tailwind.js"></script>
<style>
html,body{height:100dvh}
body{display:flex;flex-direction:column;overflow:hidden;font-size:13px;line-height:1.5}

/* ── Header (extends shared topbar) ── */
.cz-topbar{gap:12px}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.header-title{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
.header-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.header-meta>span:not(.badge){white-space:nowrap}
.back-link{font-family:var(--mono);font-size:11px;color:var(--text-tertiary);flex-shrink:0;padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);transition:color .15s,border-color .15s}
.back-link:hover{color:var(--text-secondary);border-color:var(--border-mid)}
.header-controls{display:flex;gap:4px;align-items:center;flex-shrink:0}

.badge{font-family:var(--sans);font-size:10px;padding:1px 6px;border-radius:var(--radius-sm);border:1px solid;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;color:var(--text-tertiary);border-color:var(--border)}
.badge-subagent{background:rgba(192,132,252,.06);color:rgba(192,132,252,.85);border-color:rgba(192,132,252,.22)}
.badge-main{background:rgba(74,222,128,.06);color:var(--green);border-color:rgba(74,222,128,.22)}
.badge-cron,.badge-cron-run{background:rgba(250,204,21,.05);color:var(--yellow);border-color:rgba(202,138,4,.2)}
.badge-telegram,.badge-group{background:rgba(96,165,250,.06);color:var(--blue);border-color:rgba(96,165,250,.22)}
.badge-other{background:transparent;color:var(--text-tertiary);border-color:var(--border)}

/* ── Tabs ── */
.panel-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg-primary);padding:0 16px}
.panel-tab{padding:9px 14px;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s}
.panel-tab:hover{color:var(--text-secondary)}
.panel-tab.active{color:var(--text-primary);border-bottom-color:var(--accent)}

/* ── Transcript ── */
.log-container{flex:1;overflow-y:auto;padding:8px 24px 16px 20px;scroll-behavior:smooth;scrollbar-gutter:stable}
.log-container>*{max-width:880px}

.log-entry{margin:14px 0;padding-left:12px;border-left:2px solid var(--border-mid)}
.log-entry.role-user{border-color:rgba(96,165,250,.4)}
/* User messages: right-aligned chat-bubble style */
.log-entry.role-user{margin-left:auto;max-width:82%;border-left:none;border-right:2px solid rgba(229,149,74,.4);padding-left:0;padding-right:12px;text-align:right}
.log-entry.role-user .log-header{flex-direction:row-reverse}
.log-entry.role-user .log-text{text-align:left;display:inline-block;background:rgba(229,149,74,.10);border:1px solid rgba(229,149,74,.28);border-radius:14px;border-top-right-radius:4px;padding:8px 12px}
.log-entry.role-user .image-preview{margin-left:auto}
.log-entry.role-assistant{border-color:rgba(192,132,252,.4)}
.log-entry.role-tool{border-color:rgba(202,138,4,.25)}

.log-header{display:flex;align-items:center;margin-bottom:4px;gap:8px}
.log-role{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;padding:2px 7px;border-radius:var(--radius-sm);border:1px solid;letter-spacing:.08em}
.role-user{background:rgba(96,165,250,.08);color:rgba(96,165,250,.85);border-color:rgba(96,165,250,.18)}
.role-assistant{background:rgba(192,132,252,.08);color:rgba(192,132,252,.85);border-color:rgba(192,132,252,.18)}
.role-tool{background:rgba(202,138,4,.06);color:var(--yellow);border-color:rgba(202,138,4,.15)}
.role-system{background:var(--bg-secondary);color:var(--text-tertiary);border-color:var(--border)}

.log-timestamp{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-left:auto;font-variant-numeric:tabular-nums}
.log-content{margin-bottom:3px}

.log-text{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text-secondary)}
.log-text h1,.log-text h2,.log-text h3{font-family:var(--display);margin:8px 0 4px;color:var(--text-primary)}
.log-text h1{font-size:17px}.log-text h2{font-size:15px}.log-text h3{font-size:13px}
.log-text p{margin:4px 0}
.log-text ul,.log-text ol{margin:4px 0;padding-left:20px}
.log-text code{background:var(--bg-secondary);padding:1px 4px;border-radius:var(--radius-sm);font-family:var(--mono);font-size:12px;color:var(--accent-soft)}
.log-text pre{background:var(--bg-root);padding:10px 12px;border-radius:var(--radius);overflow-x:auto;margin:8px 0;border:1px solid var(--border)}
.log-text pre code{background:none;padding:0;color:var(--text-secondary)}
.log-text a{color:var(--accent)}
.log-text a:hover{color:var(--accent-soft)}

.tool-call{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;overflow:hidden}
.tool-header{padding:6px 10px;background:var(--bg-tertiary);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.tool-name{font-family:var(--mono);font-size:11px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px}
.tool-toggle{color:var(--text-muted);transition:transform .15s;font-size:10px}
.tool-call.expanded .tool-toggle{transform:rotate(180deg)}
.tool-content{display:none}
.tool-call.expanded .tool-content{display:block}
.tool-args,.tool-result{padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.55}
.tool-args{color:var(--text-tertiary);background:var(--bg-root);white-space:pre-wrap;word-break:break-all;border-bottom:1px solid var(--border)}
.tool-result{color:var(--text-secondary);background:var(--bg-primary)}
.tool-pending{padding:8px 10px;color:var(--text-muted);font-style:italic;font-family:var(--mono);font-size:11px;background:var(--bg-root)}

.copy-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:2px 7px;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--mono);font-size:10px;transition:color .15s,border-color .15s;margin-top:4px}
.copy-btn:hover{color:var(--text-secondary);border-color:var(--border-mid)}

.image-preview{max-width:100%;max-height:320px;border-radius:var(--radius);border:1px solid var(--border);margin:8px 0;cursor:pointer;transition:border-color .15s}
.image-preview:hover{border-color:var(--border-mid)}

.thinking-block{background:var(--bg-secondary);border:1px solid var(--border);border-left:2px solid rgba(192,132,252,.4);border-radius:var(--radius);padding:8px 10px;margin:8px 0;font-style:italic;color:var(--text-tertiary);font-size:12px;line-height:1.55}

.log-meta{display:flex;gap:10px;margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums;align-items:center}
.log-cost{color:var(--accent);font-weight:600;background:var(--accent-dim);padding:1px 5px;border-radius:var(--radius-sm)}
.log-tokens{color:var(--text-muted)}
.log-model{color:var(--text-muted)}

/* ── Composer ── */
.send-bar{padding:10px 20px 12px;border-top:1px solid var(--border);background:var(--bg-primary);display:flex;gap:8px;flex-shrink:0;align-items:center}
.send-bar input{flex:1;padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .15s}
.send-bar input:focus{border-color:var(--accent)}
.send-bar input::placeholder{color:var(--text-muted)}
.send-btn{width:34px;height:34px;border-radius:var(--radius);background:var(--text-primary);border:none;color:var(--bg-root);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s;flex-shrink:0}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Sub-agents ── */
.subagents-container{flex:1;overflow-y:auto;padding:16px;display:none}
.subagents-container>div:first-child{max-width:880px;margin:0 auto}
.subagent-card{max-width:880px;margin:0 auto 6px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:border-color .15s}
.subagent-card:hover{border-color:var(--border-mid)}
.subagent-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.subagent-card-name{font-family:var(--display);font-size:12px;font-weight:500;color:var(--text-primary)}
.subagent-card-meta{font-family:var(--mono);font-size:10px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap}
.subagent-card-status{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:var(--radius-sm)}
.subagent-card-status.running{background:rgba(74,222,128,.1);color:var(--green)}
.subagent-card-status.completed{background:rgba(96,165,250,.1);color:var(--blue)}
.subagent-card-status.error{background:rgba(248,113,113,.1);color:var(--red)}

.loading,.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--text-tertiary);font-family:var(--mono);font-size:12px}

.toast-container{position:fixed;top:54px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:9px 12px;border-radius:var(--radius);font-family:var(--mono);font-size:11px;background:var(--bg-elevated);border:1px solid var(--border-mid);border-left:2px solid var(--text-muted);color:var(--text-secondary);box-shadow:var(--shadow-pop);animation:cozy-rise .18s}
.toast.success{border-left-color:var(--green);color:var(--green)}
.toast.error{border-left-color:var(--red);color:var(--red)}


/* Impeccable pass: readable hierarchy and non-clipping page shell */
body{font-size:14px;overflow:visible}
.header-title{font-size:18px}.log-text h1{font-size:22px}.log-text h2{font-size:18px}.log-text h3{font-size:14px}
.header-meta,.back-link,.badge,.panel-tab,.log-role,.log-timestamp,.tool-name,.tool-toggle,.tool-args,.tool-result,.tool-pending,.copy-btn,.thinking-block,.log-meta,.subagent-card-name,.subagent-card-meta,.subagent-card-status,.loading,.empty-state,.toast{font-size:12px!important}
.log-text,.send-bar input{font-size:14px}


/* Final detector normalization: only 12/16/22px type steps */
body,body *{font-size:20px!important}
.header-meta,.back-link,.badge,.panel-tab,.log-role,.log-timestamp,.tool-name,.tool-toggle,.tool-args,.tool-result,.tool-pending,.copy-btn,.thinking-block,.log-meta,.subagent-card-name,.subagent-card-meta,.subagent-card-status,.loading,.empty-state,.toast{font-size:12px!important}
.header-title,.log-text h1,.log-text h2{font-size:36px!important}.log-text h3{font-size:20px!important}

</style>
</head>
<body>

<header class="cz-topbar">
  <div class="header-left">
    <a href="/" class="back-link">← sessions</a>
    <div class="header-title" id="sessionTitle">loading…</div>
    <div class="header-meta" id="sessionMeta"></div>
  </div>
  <div class="header-controls">
    <button class="cz-btn sm" onclick="copyTranscript()">copy</button>
    <button class="cz-btn cz-icon-btn sm" onclick="location.reload()" title="Reload">↻</button>
  </div>
</header>

<div class="panel-tabs" id="panelTabs" style="display:none">
  <button class="panel-tab active" data-tab="transcript" onclick="switchTab('transcript',this)">transcript</button>
  <button class="panel-tab" data-tab="subagents" onclick="switchTab('subagents',this)">sub-agents</button>
</div>

<div class="log-container" id="logContainer">
  <div class="loading"><span class="cz-spinner"></span>loading session…</div>
</div>
<div class="subagents-container" id="subagentsContainer"></div>

<div class="send-bar" id="sendBar">
  <input type="text" id="sendInput" placeholder="send message to session…" autocomplete="off"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
  <button class="send-btn" onclick="sendMessage()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
  </button>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const sessionKey = decodeURIComponent(location.pathname.replace('/session/', ''));
let session = null;
let allSessions = [];
let transcriptEntries = [];
let transcriptTotal = 0;
let transcriptOffset = 0;

function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function formatTime(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return Math.floor(diff/1000) + 's';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h';
  return Math.floor(diff/86400000) + 'd';
}

function formatTimestamp(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}

function formatBadgeLabel(type) {
  const labels = {main:'main',group:'group',telegram:'telegram',cron:'cron','cron-run':'run',subagent:'sub-agent',other:'other'};
  return labels[type] || type;
}

let topicNamesMap = {};

function getSessionName(s) {
  if (s.label) return s.label;
  const topicMatch = s.key.match(/topic:(\d+)/);
  if (topicMatch) {
    const topicId = topicMatch[1];
    const topicName = topicNamesMap[topicId];
    if (topicName) return topicName;
    return s.subject ? `${s.subject} #${topicId}` : `Topic ${topicId}`;
  }
  if (s.subject) return s.subject;
  if (s.displayName) return s.displayName.replace('telegram:', '').replace('g-', 'Group ');
  if (s.key.includes(':main:main')) return 'Main DM';
  const cronMatch = s.key.match(/cron:(.{8})/);
  if (cronMatch) return `Cron ${cronMatch[1]}`;
  return s.key.split(':').slice(-2).join(':');
}

function showToast(type, title, msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = `${title}: ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function toggleToolCall(element) { element.classList.toggle('expanded'); }

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('success', 'Copied', 'Text copied'))
    .catch(() => showToast('error', 'Error', 'Failed to copy'));
}

function switchTab(tab, btn) {
  document.querySelectorAll('.panel-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('logContainer').style.display = tab === 'transcript' ? '' : 'none';
  document.getElementById('sendBar').style.display = tab === 'transcript' ? '' : 'none';
  document.getElementById('subagentsContainer').style.display = tab === 'subagents' ? 'block' : 'none';
  if (tab === 'subagents') renderSubagents();
}

function renderSubagents() {
  const container = document.getElementById('subagentsContainer');
  const isMain = session.key.endsWith(':main');
  const agents = allSessions.filter(s => {
    if (s.sessionType !== 'subagent') return false;
    if (isMain) return true;
    if (s.parentKey === session.key) return true;
    const childKeys = (session.children || []).map(c => c.key);
    if (childKeys.includes(s.key)) return true;
    return false;
  }).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  if (!agents.length) {
    container.innerHTML = '<div class="empty-state">no sub-agents found</div>';
    return;
  }

  container.innerHTML = `<div style="font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em">${agents.length} sub-agent${agents.length !== 1 ? 's' : ''}</div>` +
    agents.map(s => {
      const status = s.status === 'running' ? 'running' : (s.abortedLastRun ? 'error' : 'completed');
      const statusLabel = status === 'running' ? '● running' : (status === 'error' ? '✗ error' : '✓ done');
      const name = s.label || s.displayName || s.key.split(':').pop().slice(0, 8);
      const tokens = s.totalTokens ? `${(s.totalTokens/1000).toFixed(1)}k tok` : '';
      const model = s.model ? s.model.split('/').pop() : '';
      const ago = s.updatedAt ? formatTime(s.updatedAt) + ' ago' : '';
      return `<div class="subagent-card" onclick="window.open('/session/${encodeURIComponent(s.key)}','_blank')">
        <div class="subagent-card-header">
          <div class="subagent-card-name">${escapeHtml(name)}</div>
          <span class="subagent-card-status ${status}">${statusLabel}</span>
        </div>
        <div class="subagent-card-meta">
          ${model ? `<span>${escapeHtml(model)}</span>` : ''}
          ${tokens ? `<span>${tokens}</span>` : ''}
          ${ago ? `<span>${ago}</span>` : ''}
        </div>
      </div>`;
    }).join('');
}

function renderTranscript(entries) {
  const container = document.getElementById('logContainer');
  if (!entries.length) { container.innerHTML = '<div class="empty-state">no entries</div>'; return; }

  const resultMap = {};
  entries.forEach(entry => {
    (entry.content || []).forEach(c => { if (c.type === 'result' && c.id) resultMap[c.id] = c; });
  });
  const renderedResults = new Set();

  const html = entries.map(entry => {
    const role = entry.role || 'system';
    let contentHtml = '';
    (entry.content || []).forEach(c => {
      if (c.type === 'tool') {
        const result = resultMap[c.id];
        let resultHtml;
        if (result) {
          renderedResults.add(c.id);
          resultHtml = `<div class="tool-content">
            <div class="tool-args">${escapeHtml(JSON.stringify(c.args || {}, null, 2))}</div>
            <div class="tool-result">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                <span style="color:var(--green);font-weight:600;font-size:9px;letter-spacing:.08em">RESULT</span>
                <button class="copy-btn" style="margin-top:0" onclick="event.stopPropagation();copyText(this.closest('.tool-result').textContent)">copy</button>
              </div>
              ${escapeHtml(result.text || '(empty)')}
            </div>
          </div>`;
        } else {
          resultHtml = `<div class="tool-content">
            <div class="tool-args">${escapeHtml(JSON.stringify(c.args || {}, null, 2))}</div>
            <div class="tool-pending">waiting for result…</div>
          </div>`;
        }
        contentHtml += `<div class="tool-call" onclick="toggleToolCall(this)">
          <div class="tool-header">
            <div class="tool-name">${escapeHtml(c.name)}</div>
            <div class="tool-toggle">▾</div>
          </div>
          ${resultHtml}
        </div>`;
      } else if (c.type === 'result' && !renderedResults.has(c.id)) {
        contentHtml += `<div class="tool-call expanded">
          <div class="tool-header">
            <div class="tool-name">${escapeHtml(c.name)}</div>
            <button class="copy-btn" style="margin-top:0" onclick="event.stopPropagation();copyText(this.closest('.tool-call').querySelector('.tool-result')?.textContent||'')">copy</button>
          </div>
          <div class="tool-content"><div class="tool-result">${escapeHtml(c.text || '(empty)')}</div></div>
        </div>`;
      } else if (c.type === 'text') {
        contentHtml += `<div class="log-text">${marked.parse(c.text || '')}</div>
          <button class="copy-btn" onclick="copyText(${JSON.stringify(c.text || '')})">copy</button>`;
      } else if (c.type === 'image') {
        contentHtml += `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener"><img class="image-preview" src="${escapeHtml(c.url)}" loading="lazy"
          onerror="this.outerHTML='<span style=color:var(--text-muted)>\u26a0 image unavailable</span>'" /></a>`;
      } else if (c.type === 'attachment') {
        const u = escapeHtml(c.url||''), nm = escapeHtml(c.name || (c.url||'').split('/').pop() || 'file'), k = c.kind||'file';
        if (k === 'image') contentHtml += `<a href="${u}" target="_blank" rel="noopener"><img class="image-preview" src="${u}" loading="lazy" onerror="this.outerHTML='<span style=color:var(--text-muted)>\u26a0 image unavailable</span>'" /></a>`;
        else if (k === 'audio') contentHtml += `<audio controls preload="none" style="max-width:100%" src="${u}"></audio>`;
        else if (k === 'video') contentHtml += `<video controls preload="none" style="max-height:320px;max-width:100%;border-radius:6px" src="${u}"></video>`;
        else contentHtml += `<a href="${u}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--text-secondary);text-decoration:none">\ud83d\udcce ${nm} \u2197</a>`;
      } else if (c.type === 'thinking') {
        contentHtml += `<div class="thinking-block">${escapeHtml(c.text)}</div>`;
      }
    });
    if (!contentHtml.trim()) return '';
    const metaHtml = [];
    if (entry.model) metaHtml.push(`<span class="log-model">${entry.model}</span>`);
    if (entry.cost > 0) metaHtml.push(`<span class="log-cost">$${entry.cost.toFixed(4)}</span>`);
    if (entry.tokens && (entry.tokens.in || entry.tokens.out)) {
      metaHtml.push(`<span class="log-tokens">${entry.tokens.in}→${entry.tokens.out}</span>`);
      if (entry.tokens.cache) metaHtml.push(`<span class="log-tokens">${entry.tokens.cache} cached</span>`);
    }
    return `<div class="log-entry role-${role}">
      <div class="log-header">
        <div class="log-role role-${role}">${role.toUpperCase()}</div>
        <div class="log-timestamp">${formatTimestamp(entry.ts)}</div>
      </div>
      ${contentHtml}
      ${metaHtml.length ? `<div class="log-meta">${metaHtml.join(' ')}</div>` : ''}
    </div>`;
  }).filter(h => h).join('');

  container.innerHTML = html;
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
}

async function loadTranscript(sessionId) {
  const container = document.getElementById('logContainer');
  container.innerHTML = '<div class="loading"><span class="cz-spinner"></span>loading transcript…</div>';
  try {
    const r = await fetch(`/data/transcript/${sessionId}?limit=200&t=` + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const txt = await r.text();
    if (!txt) throw new Error('Empty response');
    const d = JSON.parse(txt);
    if (d.error) { container.innerHTML = `<div class="loading">${d.error}</div>`; return; }
    transcriptEntries = d.entries || [];
    transcriptTotal = d.total || transcriptEntries.length;
    transcriptOffset = d.offset || 0;
    renderTranscript(transcriptEntries);
    container.scrollTop = container.scrollHeight;
    if (transcriptOffset > 0) setupInfiniteScroll(sessionId, container);
  } catch(e) { container.innerHTML = `<div class="loading">failed: ${e.message}</div>`; }
}

let _loadingMore = false;
function setupInfiniteScroll(sessionId, container) {
  container.addEventListener('scroll', async function handler() {
    if (_loadingMore || transcriptOffset <= 0 || container.scrollTop > 100) return;
    _loadingMore = true;
    const prevHeight = container.scrollHeight;
    const loadOffset = Math.max(0, transcriptOffset - 100);
    const loadLimit = transcriptOffset - loadOffset;
    try {
      const r = await fetch(`/data/transcript/${sessionId}?offset=${loadOffset}&limit=${loadLimit}`);
      if (!r.ok) { _loadingMore = false; return; }
      const d = await r.json();
      if (d.entries?.length) {
        transcriptEntries = [...d.entries, ...transcriptEntries];
        transcriptOffset = loadOffset;
        renderTranscript(transcriptEntries);
        container.scrollTop = container.scrollHeight - prevHeight;
        if (transcriptOffset <= 0) container.removeEventListener('scroll', handler);
      }
    } catch(e) {}
    _loadingMore = false;
  });
}

async function refreshTranscript(sessionId) {
  try {
    const r = await fetch(`/data/transcript/${sessionId}?limit=100`);
    if (!r.ok) return;
    const text = await r.text();
    if (!text) return;
    const d = JSON.parse(text);
    if (!d.entries) return;
    const container = document.getElementById('logContainer');
    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
    const newTotal = d.total || 0;
    if (newTotal !== transcriptTotal) {
      const oldPrefix = transcriptEntries.slice(0, transcriptEntries.length - (transcriptTotal - (d.offset || 0)));
      transcriptEntries = [...oldPrefix, ...d.entries];
      transcriptTotal = newTotal;
      renderTranscript(transcriptEntries);
      if (wasAtBottom) container.scrollTop = container.scrollHeight;
    }
  } catch(e) {}
}

function copyTranscript() {
  const text = transcriptEntries.map(e => {
    const role = e.role || 'unknown';
    let content = '';
    if (Array.isArray(e.content)) content = e.content.map(b => b.text || '').filter(Boolean).join('\n');
    else content = e.content || '';
    return `[${role}] ${content}`;
  }).join('\n\n');
  navigator.clipboard.writeText(text).then(() => showToast('success','Copied','Transcript copied'));
}

async function sendMessage() {
  const input = document.getElementById('sendInput');
  const btn = input.nextElementSibling;
  const msg = input.value.trim();
  if (!msg || !session) return;
  btn.disabled = true; input.disabled = true;
  try {
    const res = await fetch('/api/send-message', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sessionId: session.sessionId, message: msg})
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : {};
    if (res.ok && data.status === 'sent') {
      input.value = '';
      showToast('success','Sent','Message sent');
      setTimeout(() => refreshTranscript(session.sessionId), 1500);
    } else {
      showToast('error','Error', data.error || 'Failed to send');
    }
  } catch(e) { showToast('error','Error',e.message); }
  btn.disabled = false; input.disabled = false;
}

async function init() {
  try {
    let d;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await fetch('/data/sessions.json?t=' + Date.now());
        if (!r.ok) { if (attempt < 2) { await new Promise(r => setTimeout(r, 500)); continue; } throw new Error(`HTTP ${r.status}`); }
        const txt = await r.text();
        if (!txt) { if (attempt < 2) { await new Promise(r => setTimeout(r, 500)); continue; } throw new Error('Empty response'); }
        d = JSON.parse(txt);
        break;
      } catch(e) { if (attempt >= 2) throw e; await new Promise(r => setTimeout(r, 500)); }
    }
    allSessions = d.sessions || [];
    if (d.topicNames) topicNamesMap = d.topicNames;
    session = allSessions.find(s => s.key === sessionKey);

    if (!session) {
      document.getElementById('sessionTitle').textContent = 'session not found';
      document.getElementById('logContainer').innerHTML = `<div class="loading">key: ${escapeHtml(sessionKey)}<br>not found in active sessions.</div>`;
      return;
    }

    document.getElementById('sessionTitle').textContent = getSessionName(session);
    document.title = getSessionName(session) + ' — OCPlatform';
    document.getElementById('sessionMeta').innerHTML = `
      <span>${session.channel || '—'}</span>
      <span>${session.sessionId?.slice(0, 8) || '—'}</span>
      <span>${formatTime(session.updatedAt)} ago</span>
      <span class="badge badge-${session.sessionType || 'other'}">${formatBadgeLabel(session.sessionType || 'other')}</span>
      ${session.totalTokens ? `<span>${(session.totalTokens/1000).toFixed(1)}k tok</span>` : ''}
      ${session.model ? `<span>${session.model.split('/').pop()}</span>` : ''}
    `;

    const isMain = session.key.endsWith(':main');
    const hasSubagents = isMain
      ? allSessions.some(s => s.sessionType === 'subagent')
      : (session.children || []).some(c => c.key?.includes(':subagent:')) ||
        allSessions.some(s => s.sessionType === 'subagent' && s.parentKey === session.key);
    if (hasSubagents) document.getElementById('panelTabs').style.display = '';

    await loadTranscript(session.sessionId);
    setInterval(() => refreshTranscript(session.sessionId), 3000);
  } catch(e) {
    document.getElementById('logContainer').innerHTML = `<div class="loading">error: ${e.message}</div>`;
  }
}

init();
</script>
