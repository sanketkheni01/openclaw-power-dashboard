<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Jobs — OpenClaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cozy-theme.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="/cozy-tailwind.js"></script>
<style>
html,body{height:100dvh}
body{display:flex;flex-direction:column;overflow:visible;font-size:13px;line-height:1.5}

/* ── Stats strip ── */
.stats-strip{
  flex-shrink:0;min-height:46px;padding:12px 20px;
  display:flex;align-items:center;gap:28px;overflow-x:auto;
  background:var(--bg-primary);border-bottom:1px solid var(--border);
}
.stat{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.stat-value{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}

/* ── Toolbar ── */
.toolbar{
  flex-shrink:0;min-height:42px;padding:12px 16px;
  display:flex;align-items:center;gap:10px;
  background:var(--bg-primary);border-bottom:1px solid var(--border);
}
.search-box{position:relative;flex:1;max-width:420px}
.search-input{
  width:100%;height:28px;padding:0 10px 0 28px;
  background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text-primary);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .15s,background .15s;
}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--accent);background:rgba(229,149,74,.03)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}


.filter-bar{display:flex;gap:3px;align-items:center}
.filter-btn{
  background:transparent;border:1px solid transparent;color:var(--text-tertiary);
  padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;
  font-family:var(--mono);font-size:13px;letter-spacing:.02em;transition:all .15s;
}
.filter-btn:hover{color:var(--text-secondary);border-color:var(--border)}
.filter-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(229,149,74,.22)}

.view-controls{display:flex;gap:2px;align-items:center;margin-left:auto}
.view-toggle{
  background:transparent;border:1px solid var(--border);color:var(--text-muted);
  width:28px;height:28px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.view-toggle:hover{border-color:var(--border-mid);color:var(--text-tertiary)}
.view-toggle.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(229,149,74,.22)}

/* ── Main ── */
.main-content{display:flex;flex:1;overflow:visible;min-height:0}
.jobs-panel{flex:1;overflow-y:auto;padding:16px;scrollbar-gutter:stable}

.jobs-grid{display:grid;gap:12px;max-width:1320px;margin:0 auto}
.grid-view{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.list-view{grid-template-columns:1fr;max-width:920px}

/* ── Job card ── */
.job-card{
  background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;
}
.job-card:hover{border-color:var(--border-mid);background:var(--bg-secondary)}
.job-card.expanded{border-color:rgba(229,149,74,.3)}
/* status spine */
.job-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--text-muted);opacity:.5}
.job-card.spine-on::before{background:var(--green);opacity:.9}
.job-card.spine-err::before{background:var(--red);opacity:.9}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-title{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.card-name{
  font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);
}
.job-card:not(.spine-on) .card-name{color:var(--text-secondary);font-weight:500}

.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--text-muted);opacity:.5}
.status-dot.status-enabled{background:var(--green);opacity:1;box-shadow:none}
.status-dot.status-disabled{background:var(--text-muted);opacity:.5}

.card-badges{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.badge{
  font-family:var(--sans);font-size:10px;font-weight:500;padding:2px 6px;border-radius:var(--radius-sm);
  border:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  color:var(--text-tertiary);background:transparent;
}
.badge-main{color:var(--green);border-color:rgba(74,222,128,.22);background:rgba(74,222,128,.06)}
.badge-isolated{color:var(--blue);border-color:rgba(96,165,250,.22);background:rgba(96,165,250,.06)}
.badge-agentTurn{color:var(--accent);border-color:rgba(229,149,74,.25);background:var(--accent-dim)}
.badge-systemEvent{color:var(--text-tertiary);border-color:var(--border);background:transparent}
.model-pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);white-space:nowrap}

.card-schedule{font-family:var(--mono);font-size:13px;color:var(--accent-soft);margin-bottom:5px;font-weight:500}
.card-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px;font-family:var(--mono);font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}

.status-info{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:6px;font-size:13px}
.status-row{display:flex;justify-content:space-between;margin-bottom:3px}
.status-row:last-child{margin-bottom:0}
.status-label{color:var(--text-muted)}
.status-value{color:var(--text-secondary);font-family:var(--mono)}
.status-value.ok{color:var(--green)}
.status-value.error{color:var(--red)}

.card-actions{display:flex;gap:8px;align-items:center;margin-top:10px}
.toggle-switch{position:relative;width:34px;height:18px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:background .15s,border-color .15s;flex-shrink:0}
.toggle-switch.on{background:var(--green);border-color:var(--green)}
.toggle-knob{position:absolute;width:14px;height:14px;background:var(--text-primary);border-radius:50%;top:1px;left:1px;transition:transform .15s}
.toggle-switch.on .toggle-knob{transform:translateX(16px);background:#0a0a0a}
.run-btn{
  height:24px;padding:0 12px;background:var(--accent);color:#0a0a0a;border:1px solid var(--accent);
  border-radius:var(--radius);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;transition:background .15s,opacity .15s;
}
.run-btn:hover{background:var(--accent-soft)}
.run-btn:disabled{opacity:.4;cursor:not-allowed}

.payload-section{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.payload-toggle{font-family:var(--mono);font-size:10px;color:var(--text-muted);cursor:pointer;text-transform:uppercase;letter-spacing:.08em;user-select:none}
.payload-toggle:hover{color:var(--text-tertiary)}
.payload-content{display:none;margin-top:6px;padding:12px;background:var(--bg-root);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:13px;color:var(--text-tertiary);white-space:pre-wrap;word-break:break-word;max-height:140px;overflow-y:auto;line-height:1.6}
.payload-content.expanded{display:block}

/* ── Detail panel (run history) ── */
.detail-panel{
  position:fixed;top:0;right:0;width:560px;height:100dvh;
  background:var(--bg-primary);border-left:1px solid var(--border-mid);
  display:flex;flex-direction:column;z-index:60;box-shadow:var(--shadow-panel);
}
.detail-panel.detached{width:100vw;left:0;right:0;border-left:none;z-index:100}
.panel-header{
  flex-shrink:0;min-height:44px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
  background:var(--bg-secondary);border-bottom:1px solid var(--border);position:relative;
}
.panel-header::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--accent),rgba(229,149,74,0) 40%)}
.panel-title{font-family:var(--display);font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
.panel-controls{display:flex;gap:4px;align-items:center}
.panel-meta{
  flex-shrink:0;padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  font-family:var(--mono);font-size:10px;color:var(--text-muted);
  background:var(--bg-primary);border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;
}
.history-container{flex:1;overflow-y:auto;padding:8px 16px 16px}

.run-entry{border-left:2px solid var(--border-mid);margin:10px 0;padding-left:12px}
.run-entry.status-ok{border-color:rgba(74,222,128,.4)}
.run-entry.status-error{border-color:rgba(248,113,113,.4)}
.run-header{display:flex;align-items:center;margin-bottom:4px;gap:8px}
.run-status{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:var(--radius-sm);border:1px solid;letter-spacing:.06em}
.status-ok{background:rgba(74,222,128,.08);color:var(--green);border-color:rgba(74,222,128,.18)}
.status-error{background:rgba(248,113,113,.08);color:var(--red);border-color:rgba(248,113,113,.18)}
.run-timestamp{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-left:auto;font-variant-numeric:tabular-nums}
.run-summary{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text-secondary);margin:4px 0}
.run-meta{display:flex;gap:10px;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}

@media(max-width:768px){
  .detail-panel{width:100vw}
  .grid-view{grid-template-columns:1fr!important}
}
@media(max-width:640px){
  .stats-strip{gap:18px;padding:10px 12px}
  .toolbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .search-box{flex:1 1 100%;max-width:none}
}
.hidden{display:none!important}

.panel-header{padding:12px 16px!important;min-height:52px!important;height:auto!important}
</style>
</head>
<body>

<div class="cz-toasts" id="toastContainer"></div>

<header class="cz-topbar">
  <div class="cz-brand">
    <span class="cz-led green live"></span>
    <span class="cz-mark">OPENCLAW</span>
    <span class="cz-sep">/</span>
    <span class="cz-page">cron</span>
  </div>
  <nav class="cz-nav">
    <a href="/">sessions</a>
    <a href="/cron.html" class="active">cron</a>
    <a href="/logs.html">logs</a>
    <a href="/keys">keys</a>
    <a href="/system.html">system</a>
    <button class="cz-btn cz-icon-btn sm" onclick="refreshData()" title="Refresh (r)" style="margin-left:6px">↻</button>
  </nav>
</header>

<div class="stats-strip">
  <div class="stat"><span class="stat-value" id="totalJobs">0</span><span class="stat-label">total</span></div>
  <div class="stat"><span class="stat-value" id="activeJobs" style="color:var(--green)">0</span><span class="stat-label">active</span></div>
  <div class="stat"><span class="stat-value" id="disabledJobs" style="color:var(--text-tertiary)">0</span><span class="stat-label">disabled</span></div>
  <div class="stat"><span class="stat-value" id="lastRunTime" style="color:var(--text-secondary);font-size:13px">—</span><span class="stat-label">last run</span></div>
</div>

<div class="toolbar">
  <div class="search-box">
    <div class="search-icon">⌕</div>
    <input type="text" class="search-input" placeholder="search jobs…  ( / )" id="searchInput" onkeyup="handleSearch()">
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">all</button>
    <button class="filter-btn" onclick="setFilter('active', this)">active</button>
    <button class="filter-btn" onclick="setFilter('disabled', this)">disabled</button>
    <button class="filter-btn" onclick="setFilter('errored', this)">errored</button>
  </div>
  <div class="view-controls">
    <button class="view-toggle active" id="gridView" onclick="setViewMode('grid')" title="Grid">⊞</button>
    <button class="view-toggle" id="listView" onclick="setViewMode('list')" title="List">≡</button>
  </div>
</div>

<div class="main-content">
  <div class="jobs-panel">
    <div class="jobs-grid grid-view" id="jobsGrid">
      <div class="cz-state"><span class="cz-spinner"></span><div class="cz-state-sub">loading cron jobs…</div></div>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel" style="display: none;">
    <div class="panel-header">
      <div class="panel-title" id="panelTitle">select a job</div>
      <div class="panel-controls">
        <button class="cz-btn cz-icon-btn sm" onclick="toggleDetachPanel()" id="detachBtn" title="Fullscreen">⧉</button>
        <button class="cz-btn cz-icon-btn sm" onclick="closeDetailPanel()" title="Close">×</button>
      </div>
    </div>
    <div class="panel-meta" id="panelMeta"></div>
    <div class="history-container" id="historyContainer">
      <div class="cz-state"><span class="cz-spinner"></span><div class="cz-state-sub">loading run history…</div></div>
    </div>
  </div>
</div>

<script>
// Global state
let allJobs = [];
let filteredJobs = [];
let currentFilter = 'all';
let currentViewMode = 'grid';
let searchTerm = '';
let selectedJob = null;

document.addEventListener('DOMContentLoaded', () => {
  refreshData();
  setupKeyboardShortcuts();
  setInterval(refreshData, 30000); // Auto-refresh every 30 seconds
});

async function refreshData() {
  try {
    const response = await fetch('/data/cron-jobs.json');
    const data = await response.json();
    
    if (data.error) {
      showToast('error', 'Error', data.error);
      return;
    }
    
    allJobs = data.jobs || [];
    updateStats();
    applyFiltersAndSort();
  } catch (error) {
    showToast('error', 'Network Error', error.message);
  }
}

function updateStats() {
  const total = allJobs.length;
  const active = allJobs.filter(j => j.enabled).length;
  const disabled = total - active;
  
  // Find most recent run
  const lastRuns = allJobs.map(j => j.state?.lastRunAtMs).filter(t => t).sort((a, b) => b - a);
  const lastRunTime = lastRuns[0];
  
  document.getElementById('totalJobs').textContent = total;
  document.getElementById('activeJobs').textContent = active;
  document.getElementById('disabledJobs').textContent = disabled;
  document.getElementById('lastRunTime').textContent = lastRunTime ? formatTime(lastRunTime) + ' ago' : '—';
}

function setFilter(filter, button) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  applyFiltersAndSort();
}

function handleSearch() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase();
  applyFiltersAndSort();
}

function setViewMode(mode) {
  currentViewMode = mode;
  document.querySelectorAll('.view-toggle').forEach(b => b.classList.remove('active'));
  document.getElementById(mode + 'View').classList.add('active');
  const grid = document.getElementById('jobsGrid');
  grid.className = `jobs-grid ${mode}-view`;
  renderJobs();
}

function applyFiltersAndSort() {
  let jobs = [...allJobs];
  
  // Apply search filter
  if (searchTerm) {
    jobs = jobs.filter(j =>
      j.name.toLowerCase().includes(searchTerm) ||
      j.id.toLowerCase().includes(searchTerm)
    );
  }
  
  // Apply category filter
  if (currentFilter !== 'all') {
    jobs = jobs.filter(j => {
      switch (currentFilter) {
        case 'active': return j.enabled;
        case 'disabled': return !j.enabled;
        case 'errored': return j.state?.lastStatus === 'error';
        default: return true;
      }
    });
  }
  
  // Sort by last run time, enabled first
  jobs.sort((a, b) => {
    if (a.enabled !== b.enabled) return b.enabled - a.enabled;
    const aTime = a.state?.lastRunAtMs || 0;
    const bTime = b.state?.lastRunAtMs || 0;
    return bTime - aTime;
  });
  
  filteredJobs = jobs;
  renderJobs();
}

function renderJobs() {
  const container = document.getElementById('jobsGrid');
  
  if (!filteredJobs.length) {
    container.innerHTML = '<div class="cz-state"><div class="cz-state-mark">[ ∅ ]</div><div class="cz-state-title">No jobs match</div><div class="cz-state-sub">Adjust the filter or search to see scheduled jobs.</div></div>';
    return;
  }
  
  const html = filteredJobs.map(job => createJobCard(job)).join('');
  container.innerHTML = html;
}

function createJobCard(job) {
  const scheduleText = formatSchedule(job.schedule);
  const status = job.enabled ? 'enabled' : 'disabled';
  const lastStatus = job.state?.lastStatus || 'never';
  const lastRun = job.state?.lastRunAtMs;
  const nextRun = job.state?.nextRunAtMs;
  const duration = job.state?.lastDurationMs;
  
  const sessionTarget = job.sessionTarget || 'main';
  const payloadKind = job.payload?.kind || 'unknown';
  const model = job.payload?.model;
  
  const statusClass = lastStatus === 'ok' ? 'ok' : (lastStatus === 'error' ? 'error' : '');
  const spineClass = lastStatus === 'error' ? 'spine-err' : (job.enabled ? 'spine-on' : '');
  
  return `
    <div class="job-card ${spineClass}" onclick="openJobDetail('${escapeHtml(job.id)}')">
      <div class="card-header">
        <div class="card-title">
          <div class="status-dot status-${status}"></div>
          <div class="card-name">${escapeHtml(job.name)}</div>
        </div>
        <div class="card-badges">
          ${model ? `<div class="model-pill">${escapeHtml(model.split('/').pop())}</div>` : ''}
          <div class="badge badge-${sessionTarget}">${sessionTarget}</div>
          <div class="badge badge-${payloadKind}">${payloadKind}</div>
        </div>
      </div>
      
      <div class="card-schedule">${escapeHtml(scheduleText)}</div>
      
      <div class="card-meta">
        <span>ID ${job.id.slice(0, 8)}</span>
        ${lastRun ? `<span>last ${formatTime(lastRun)} ago</span>` : '<span>never run</span>'}
        ${duration ? `<span>took ${formatDuration(duration)}</span>` : ''}
        ${nextRun ? `<span>next ${formatTime(nextRun)}</span>` : ''}
      </div>
      
      <div class="status-info">
        <div class="status-row">
          <span class="status-label">status</span>
          <span class="status-value ${statusClass}">${lastStatus === 'never' ? 'never run' : lastStatus.toUpperCase()}</span>
        </div>
        ${job.delivery?.mode ? `
          <div class="status-row">
            <span class="status-label">delivery</span>
            <span class="status-value">${job.delivery.mode}</span>
          </div>
        ` : ''}
      </div>
      
      <div class="card-actions" onclick="event.stopPropagation()">
        <div class="toggle-switch ${job.enabled ? 'on' : ''}" onclick="toggleJob('${job.id}', ${!job.enabled})">
          <div class="toggle-knob"></div>
        </div>
        <button class="run-btn" onclick="runJob('${job.id}')" ${!job.enabled ? 'disabled' : ''}>
          run now
        </button>
      </div>
      
      ${job.payload?.message ? `
        <div class="payload-section">
          <div class="payload-toggle" onclick="event.stopPropagation(); togglePayload(this)">
            ▶ payload message
          </div>
          <div class="payload-content">${escapeHtml(truncateText(job.payload.message, 200))}</div>
        </div>
      ` : ''}
    </div>
  `;
}

function formatSchedule(schedule) {
  if (!schedule) return 'No schedule';
  
  switch (schedule.kind) {
    case 'every':
      const ms = schedule.everyMs;
      if (ms >= 86400000) return `every ${Math.floor(ms / 86400000)}d`;
      if (ms >= 3600000) return `every ${Math.floor(ms / 3600000)}h`;
      if (ms >= 60000) return `every ${Math.floor(ms / 60000)}m`;
      return `every ${Math.floor(ms / 1000)}s`;
    
    case 'cron':
      return `cron ${schedule.expr}${schedule.tz ? ` (${schedule.tz})` : ''}`;
    
    case 'at':
      const atTime = new Date(schedule.atMs);
      return `at ${atTime.toLocaleString()}`;
    
    default:
      return `${schedule.kind} schedule`;
  }
}

function formatTime(timestamp) {
  if (!timestamp) return '—';
  const diff = Date.now() - timestamp;
  if (diff < 0) return 'future'; // Next run time
  const seconds = Math.floor(diff / 1000);
  if (seconds < 60) return seconds + 's';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + 'm';
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + 'h';
  return Math.floor(hours / 24) + 'd';
}

function formatDuration(ms) {
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return Math.floor(ms / 1000) + 's';
  const minutes = Math.floor(ms / 60000);
  const seconds = Math.floor((ms % 60000) / 1000);
  return `${minutes}m${seconds}s`;
}

function truncateText(text, maxLength) {
  if (text.length <= maxLength) return text;
  return text.substring(0, maxLength) + '...';
}

function togglePayload(element) {
  const content = element.nextElementSibling;
  const isExpanded = content.classList.contains('expanded');
  content.classList.toggle('expanded');
  element.textContent = (isExpanded ? '▶' : '▼') + ' payload message';
}

async function toggleJob(jobId, enabled) {
  try {
    const response = await fetch('/api/cron/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobId, enabled })
    });
    
    const result = await response.json();
    
    if (result.error) {
      showToast('error', 'Error', result.error);
      return;
    }
    
    showToast('success', 'Updated', `Job ${enabled ? 'enabled' : 'disabled'}`);
    refreshData();
  } catch (error) {
    showToast('error', 'Error', error.message);
  }
}

async function runJob(jobId) {
  const job = allJobs.find(j => j.id === jobId);
  if (!job) return;
  
  showToast('info', 'Running', `Starting ${job.name}...`);
  
  try {
    const response = await fetch('/api/cron/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobId })
    });
    
    const result = await response.json();
    
    if (result.error) {
      showToast('error', 'Failed', result.error);
      return;
    }
    
    showToast('success', 'Started', `Job execution initiated`);
    
    // Refresh after a delay to pick up the run
    setTimeout(refreshData, 2000);
  } catch (error) {
    showToast('error', 'Error', error.message);
  }
}

async function openJobDetail(jobId) {
  const job = allJobs.find(j => j.id === jobId);
  if (!job) return;
  
  selectedJob = job;
  document.getElementById('detailPanel').style.display = 'flex';
  document.getElementById('panelTitle').textContent = job.name;
  
  const meta = document.getElementById('panelMeta');
  meta.innerHTML = `
    <span>ID ${job.id.slice(0, 8)}</span>
    <span>${job.enabled ? '● enabled' : '○ disabled'}</span>
    <span>${formatSchedule(job.schedule)}</span>
    <span class="badge badge-${job.sessionTarget || 'main'}">${job.sessionTarget || 'main'}</span>
    ${job.payload?.model ? `<span>${job.payload.model.split('/').pop()}</span>` : ''}
  `;
  
  await loadJobHistory(jobId);
}

async function loadJobHistory(jobId) {
  const container = document.getElementById('historyContainer');
  container.innerHTML = '<div class="cz-state"><span class="cz-spinner"></span><div class="cz-state-sub">loading run history…</div></div>';
  
  try {
    const response = await fetch(`/data/cron-runs/${jobId}`);
    const data = await response.json();
    
    if (data.error) {
      container.innerHTML = `<div class="cz-state"><div class="cz-state-sub">Error: ${data.error}</div></div>`;
      return;
    }
    
    const runs = data.runs || [];
    
    if (!runs.length) {
      container.innerHTML = '<div class="cz-state"><div class="cz-state-mark">[ — ]</div><div class="cz-state-sub">no run history yet</div></div>';
      return;
    }
    
    const html = runs.reverse().map(run => createRunEntry(run)).join('');
    container.innerHTML = html;
  } catch (error) {
    container.innerHTML = `<div class="cz-state"><div class="cz-state-sub">Failed: ${error.message}</div></div>`;
  }
}

function createRunEntry(run) {
  const status = run.status || 'unknown';
  const timestamp = new Date(run.ts).toLocaleString();
  const duration = run.durationMs ? formatDuration(run.durationMs) : '';
  
  return `
    <div class="run-entry status-${status}">
      <div class="run-header">
        <div class="run-status status-${status}">${status.toUpperCase()}</div>
        <div class="run-timestamp">${timestamp}</div>
      </div>
      ${run.summary ? `<div class="run-summary">${escapeHtml(run.summary)}</div>` : ''}
      <div class="run-meta">
        ${duration ? `<span>took ${duration}</span>` : ''}
        ${run.sessionId ? `<span>session ${run.sessionId.slice(0, 8)}</span>` : ''}
        ${run.nextRunAtMs ? `<span>next ${formatTime(run.nextRunAtMs)}</span>` : ''}
      </div>
    </div>
  `;
}

function closeDetailPanel() {
  const panel = document.getElementById('detailPanel');
  panel.style.display = 'none';
  panel.classList.remove('detached');
  document.getElementById('detachBtn').textContent = '⧉';
  selectedJob = null;
}

function toggleDetachPanel() {
  const panel = document.getElementById('detailPanel');
  const btn = document.getElementById('detachBtn');
  panel.classList.toggle('detached');
  btn.textContent = panel.classList.contains('detached') ? '⊟' : '⧉';
  btn.title = panel.classList.contains('detached') ? 'Restore' : 'Fullscreen';
}

function setupKeyboardShortcuts() {
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    switch (e.key) {
      case '/': e.preventDefault(); document.getElementById('searchInput').focus(); break;
      case 'Escape': closeDetailPanel(); break;
      case 'r': refreshData(); break;
    }
  });
}

function showToast(type, title, message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `cz-toast ${type}`;
  const icons = {success: '✓', error: '✗', info: '●'};
  toast.innerHTML = `
    <div class="cz-toast-icon">${icons[type] || '●'}</div>
    <div>
      <div class="cz-toast-title">${title}</div>
      <div class="cz-toast-msg">${message}</div>
    </div>
    <button class="cz-toast-close" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 16);
  setTimeout(() => { 
    toast.classList.remove('show'); 
    setTimeout(() => toast.remove(), 220); 
  }, 5000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
