<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Logs — OpenClaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cozy-theme.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="/cozy-tailwind.js"></script>
<style>
:root{--gutter:3px}
html,body{height:100dvh;overflow:hidden}
body{display:flex;flex-direction:column;font-size:14px;font-family:var(--mono)}

/* Display family (Space Grotesk) for wordmark + section labels; JetBrains Mono for telemetry */
.cz-brand .cz-mark,.cz-brand .cz-page{font-family:var(--display)}

/* ── Toolbar ── */
.toolbar{
  flex-shrink:0;min-height:50px;padding:12px 14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--bg-primary);border-bottom:1px solid var(--border);
}

/* Level toggles with embedded counts */
.level-toggle{
  display:flex;align-items:stretch;height:26px;cursor:pointer;
  border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;
  transition:border-color .15s,opacity .15s;opacity:.4;user-select:none;
}
.level-toggle:hover{opacity:.7}
.level-toggle.active{opacity:1}
.level-toggle .lt-label{padding:0 8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center}
.level-toggle .lt-count{padding:0 7px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;display:flex;align-items:center;border-left:1px solid var(--border);font-variant-numeric:tabular-nums}

.lt-info{color:var(--green);border-color:rgba(74,222,128,.3)}
.lt-info.active{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3)}
.lt-info .lt-count{color:var(--green);border-color:rgba(74,222,128,.2)}

.lt-warn{color:var(--yellow);border-color:rgba(250,204,21,.3)}
.lt-warn.active{background:rgba(250,204,21,.1);border-color:rgba(250,204,21,.3)}
.lt-warn .lt-count{color:var(--yellow);border-color:rgba(250,204,21,.2)}

.lt-error{color:var(--red);border-color:rgba(248,113,113,.3)}
.lt-error.active{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
.lt-error .lt-count{color:var(--red);border-color:rgba(248,113,113,.2)}

.tb-sep{width:1px;height:18px;background:var(--border-mid);flex-shrink:0;margin:0 2px}

.tb-select{
  background:var(--bg-secondary);color:var(--text-secondary);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0 8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;cursor:pointer;outline:none;height:26px;
  transition:border-color .15s;
}
.tb-select:hover{border-color:var(--border-mid)}
.tb-select:focus{border-color:var(--accent)}

.tb-search{
  background:var(--bg-secondary);color:var(--text-primary);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0 10px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;outline:none;height:26px;width:240px;
  transition:border-color .15s,background .15s;
}
.tb-search::placeholder{color:var(--text-muted)}
.tb-search:focus{border-color:var(--accent);background:rgba(229,149,74,.03)}
.tb-search.has-error{border-color:var(--red);background:rgba(248,113,113,.04)}

.tb-date{
  background:var(--bg-secondary);color:var(--text-secondary);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0 8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;cursor:pointer;outline:none;height:26px;width:130px;
  transition:border-color .15s;color-scheme:dark;
}
.tb-date:hover{border-color:var(--border-mid)}
.tb-date:focus{border-color:var(--accent)}

.tb-spacer{flex:1}

.pin-btn{
  display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;
  background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text-tertiary);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;
  cursor:pointer;white-space:nowrap;transition:all .15s;
}
.pin-btn:hover{color:var(--text-secondary);border-color:var(--border-mid)}
.pin-btn.pinned{color:var(--green);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}

.live-indicator{display:flex;align-items:center;gap:6px;margin-left:4px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.live-dot.on{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.5);animation:cozy-pulse 2.4s ease-in-out infinite}
.live-label{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.live-dot.on+.live-label{color:var(--green)}

/* ── Log stream ── */
.stream{flex:1;overflow-y:auto;overflow-x:hidden;font-family:'JetBrains Mono',ui-monospace,monospace}

.col-header{
  display:grid;grid-template-columns:var(--gutter) 96px 52px 132px 1fr;
  position:sticky;top:0;z-index:10;background:var(--bg-primary);border-bottom:1px solid var(--border);
}
.col-header span{font-family:var(--display);font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:8px 10px}
.col-header .ch-gutter{padding:0}

.log-entry{
  display:grid;grid-template-columns:var(--gutter) 96px 52px 132px 1fr;
  border-bottom:1px solid rgba(233,236,242,.025);cursor:pointer;transition:background .08s;
}
.log-entry:hover{background:var(--bg-secondary)}
.log-entry.expanded{background:var(--bg-secondary)}

/* Severity gutter — the signature */
.entry-gutter{width:var(--gutter);min-height:100%}
.gutter-info{background:var(--green);opacity:.4}
.gutter-warn{background:var(--yellow);opacity:.6}
.gutter-error{background:var(--red);opacity:.85}
.log-entry:hover .gutter-info,.log-entry.expanded .gutter-info{opacity:.7}
.log-entry:hover .gutter-warn,.log-entry.expanded .gutter-warn{opacity:.9}
.log-entry:hover .gutter-error,.log-entry.expanded .gutter-error{opacity:1}

.entry-cell{padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;line-height:18px}
.entry-time{color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.entry-level{font-size:11px;font-weight:700;letter-spacing:.04em}
.lvl-info{color:var(--green)}
.lvl-warn{color:var(--yellow)}
.lvl-error{color:var(--red)}
.entry-subsys{color:var(--text-tertiary);font-size:11px}
.entry-msg{color:var(--text-secondary);min-width:0}

/* Expand panel */
.expand-panel{display:none;border-bottom:1px solid var(--border);background:var(--bg-root)}
.expand-panel.open{display:block}
.expand-panel pre{padding:12px 14px 12px calc(var(--gutter) + 14px);font-size:11px;line-height:1.6;color:var(--text-tertiary);white-space:pre-wrap;word-break:break-all;max-height:360px;overflow-y:auto}
.expand-panel pre .json-key{color:var(--accent)}
.expand-panel pre .json-str{color:var(--green);opacity:.8}
.expand-panel pre .json-num{color:var(--yellow);opacity:.85}
.expand-panel pre .json-bool{color:var(--blue);opacity:.85}
.expand-panel pre .json-null{color:var(--text-muted)}

/* Footer */
.footer{
  flex-shrink:0;min-height:38px;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg-primary);border-top:1px solid var(--border);
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;
}

@media(max-width:1080px){
  .col-header,.log-entry{grid-template-columns:var(--gutter) 80px 44px 96px 1fr}
  .tb-search{width:150px}
}
</style>
</head>
<body>

<header class="cz-topbar">
  <div class="cz-brand">
    <span class="cz-mark">OPENCLAW</span>
    <span class="cz-sep">/</span>
    <span class="cz-page">logs</span>
  </div>
  <nav class="cz-nav">
    <a href="/">sessions</a>
    <a href="/cron.html">cron</a>
    <a href="/logs.html" class="active">logs</a>
    <a href="/keys">keys</a>
    <a href="/system.html">system</a>
  </nav>
</header>

<div class="toolbar">
  <div class="level-toggle lt-info active" data-level="INFO" onclick="toggleLevel('INFO',this)" title="Toggle INFO (1)">
    <span class="lt-label">INFO</span><span class="lt-count" id="countInfo">0</span>
  </div>
  <div class="level-toggle lt-warn active" data-level="WARN" onclick="toggleLevel('WARN',this)" title="Toggle WARN (2)">
    <span class="lt-label">WARN</span><span class="lt-count" id="countWarn">0</span>
  </div>
  <div class="level-toggle lt-error active" data-level="ERROR" onclick="toggleLevel('ERROR',this)" title="Toggle ERROR (3)">
    <span class="lt-label">ERR</span><span class="lt-count" id="countError">0</span>
  </div>

  <div class="tb-sep"></div>

  <select class="tb-select" id="subsysSelect" onchange="applyFilters()" title="Subsystem">
    <option value="">all subsystems</option>
  </select>

  <input class="tb-search" id="searchInput" type="text" placeholder="/regex or text…  ( f )" title="Search (f)" oninput="applyFilters()">

  <input class="tb-date" id="dateInput" type="date" title="Log date" onchange="loadLogs()">

  <div class="tb-spacer"></div>

  <button class="pin-btn pinned" id="pinBtn" onclick="togglePin()" title="Auto-scroll">
    <span>▼</span> TAIL
  </button>

  <div class="live-indicator">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-label" id="liveLabel">OFFLINE</span>
  </div>
</div>

<div class="stream" id="stream">
  <div class="col-header">
    <span class="ch-gutter"></span>
    <span>time</span>
    <span>level</span>
    <span>subsys</span>
    <span>message</span>
  </div>
  <div id="logContainer"></div>
  <div class="cz-state" id="emptyState" style="display:none">
    <div class="cz-state-mark">[ — ]</div>
    <div class="cz-state-title">No matching log lines</div>
    <div class="cz-state-sub">Loosen the level toggles or clear the search to see more of the stream.</div>
  </div>
</div>

<div class="footer">
  <span id="footerCount">0 lines</span>
  <span id="footerStatus">loading…</span>
</div>

<script>
// Live tail via SSE (works through HTTPS reverse proxies)
const MAX_DOM = 1500;

let allEntries = [];
let visibleIndices = [];
let activeLevels = new Set(['INFO','WARN','ERROR']);
let searchRegex = null;
let isPinned = true;
let wsConnected = false;
let expandedEl = null;

const dateInput = document.getElementById('dateInput');
const container = document.getElementById('logContainer');
const stream = document.getElementById('stream');

dateInput.value = todayStr();

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// ── Level toggles ──
function toggleLevel(level, el){
  if(activeLevels.has(level)){activeLevels.delete(level);el.classList.remove('active')}
  else{activeLevels.add(level);el.classList.add('active')}
  applyFilters();
}

function updateCounts(){
  let inf=0,wrn=0,err=0;
  for(const e of allEntries){
    if(e.level==='INFO')inf++;else if(e.level==='WARN')wrn++;else if(e.level==='ERROR')err++;
  }
  document.getElementById('countInfo').textContent=inf;
  document.getElementById('countWarn').textContent=wrn;
  document.getElementById('countError').textContent=err;
}

// ── Pin / tail ──
function togglePin(){
  isPinned=!isPinned;
  const btn=document.getElementById('pinBtn');
  btn.classList.toggle('pinned',isPinned);
  btn.innerHTML=isPinned?'<span>▼</span> TAIL':'<span>▽</span> PAUSED';
  if(isPinned)scrollBottom();
  updateLive();
}

function scrollBottom(){stream.scrollTop=stream.scrollHeight}

function updateLive(){
  const dot=document.getElementById('liveDot');
  const label=document.getElementById('liveLabel');
  if(wsConnected&&isPinned){dot.classList.add('on');label.textContent='LIVE'}
  else if(wsConnected){dot.classList.remove('on');label.textContent='CONNECTED'}
  else{dot.classList.remove('on');label.textContent='OFFLINE'}
}

// ── Filtering ──
function applyFilters(){
  const searchEl=document.getElementById('searchInput');
  const raw=searchEl.value;
  searchEl.classList.remove('has-error');
  searchRegex=null;
  if(raw){
    try{searchRegex=new RegExp(raw,'i')}
    catch(e){searchEl.classList.add('has-error')}
  }
  renderAll();
}

function matches(e){
  if(!activeLevels.has(e.level))return false;
  const sub=document.getElementById('subsysSelect').value;
  if(sub&&e.subsystem!==sub)return false;
  if(searchRegex){
    const hay=(e.message||'')+' '+(e.subsystem||'')+' '+(e.time||'');
    if(!searchRegex.test(hay))return false;
  }
  return true;
}

// ── Rendering ──
function renderAll(){
  container.innerHTML='';
  expandedEl=null;
  visibleIndices=[];
  for(let i=0;i<allEntries.length;i++){if(matches(allEntries[i]))visibleIndices.push(i)}
  const empty=document.getElementById('emptyState');
  if(!visibleIndices.length){empty.style.display='flex';document.getElementById('footerCount').textContent='0 lines';return}
  empty.style.display='none';
  const frag=document.createDocumentFragment();
  for(const idx of visibleIndices)frag.appendChild(buildEntry(idx));
  container.appendChild(frag);
  document.getElementById('footerCount').textContent=visibleIndices.length+' lines';
  if(isPinned)scrollBottom();
}

function gutterClass(level){return level==='WARN'?'gutter-warn':level==='ERROR'?'gutter-error':'gutter-info'}
function levelClass(level){return level==='WARN'?'lvl-warn':level==='ERROR'?'lvl-error':'lvl-info'}

function fmtTime(t){
  if(!t)return '—';
  try{
    const d=new Date(t);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
  }catch(e){return t.slice(11,23)||t}
}

function buildEntry(idx){
  const e=allEntries[idx];
  const wrap=document.createElement('div');

  // Row
  const row=document.createElement('div');
  row.className='log-entry';
  row.dataset.idx=idx;

  const gutter=document.createElement('div');
  gutter.className='entry-gutter '+gutterClass(e.level);

  const time=document.createElement('div');
  time.className='entry-cell entry-time';
  time.textContent=fmtTime(e.time);

  const level=document.createElement('div');
  level.className='entry-cell entry-level '+levelClass(e.level);
  level.textContent=e.level==='ERROR'?'ERR':e.level==='WARN'?'WRN':'INF';

  const subsys=document.createElement('div');
  subsys.className='entry-cell entry-subsys';
  subsys.textContent=e.subsystem||'—';

  const msg=document.createElement('div');
  msg.className='entry-cell entry-msg';
  msg.textContent=e.message||'';

  row.append(gutter,time,level,subsys,msg);

  // Expand panel
  const panel=document.createElement('div');
  panel.className='expand-panel';
  const pre=document.createElement('pre');
  try{pre.innerHTML=syntaxHL(JSON.stringify(JSON.parse(e.raw),null,2))}
  catch(_){pre.textContent=e.raw||''}
  panel.appendChild(pre);

  row.addEventListener('click',()=>{
    if(expandedEl&&expandedEl!==panel){expandedEl.classList.remove('open');expandedEl.previousElementSibling?.classList.remove('expanded')}
    if(expandedEl===panel){panel.classList.remove('open');row.classList.remove('expanded');expandedEl=null}
    else{panel.classList.add('open');row.classList.add('expanded');expandedEl=panel}
  });

  wrap.append(row,panel);
  return wrap;
}

// Syntax highlight JSON
function syntaxHL(json){
  return json.replace(/("(?:[^"\\]|\\.)*")\s*:/g,'<span class="json-key">$1</span>:')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g,': <span class="json-str">$1</span>')
    .replace(/:\s*(\d+(?:\.\d+)?)/g,': <span class="json-num">$1</span>')
    .replace(/:\s*(true|false)/g,': <span class="json-bool">$1</span>')
    .replace(/:\s*(null)/g,': <span class="json-null">$1</span>');
}

// ── Subsystem dropdown ──
function rebuildSubsys(){
  const sel=document.getElementById('subsysSelect');
  const prev=sel.value;
  const subs=[...new Set(allEntries.map(e=>e.subsystem).filter(Boolean))].sort();
  sel.innerHTML='<option value="">all subsystems</option>'+subs.map(s=>`<option value="${s}"${s===prev?' selected':''}>${s}</option>`).join('');
}

// ── Load logs ──
async function loadLogs(){
  document.getElementById('footerStatus').textContent='loading…';
  const date=dateInput.value||todayStr();
  try{
    const r=await fetch(`/data/logs.json?date=${date}&limit=1500&offset=-1`);
    const d=await r.json();
    if(d.error){document.getElementById('footerStatus').textContent='error: '+d.error;return}
    allEntries=d.entries||[];
    updateCounts();
    rebuildSubsys();
    renderAll();
    document.getElementById('footerStatus').textContent=`${allEntries.length} of ${d.total} entries`;
    if(isPinned)scrollBottom();
  }catch(e){
    document.getElementById('footerStatus').textContent='fetch error';
    console.error(e);
  }
}

// ── Live tail (append) ──
function appendEntry(e){
  allEntries.push(e);
  updateCounts();

  // Update subsys dropdown
  if(e.subsystem){
    const sel=document.getElementById('subsysSelect');
    const opts=new Set(Array.from(sel.options).map(o=>o.value));
    if(!opts.has(e.subsystem)){const o=document.createElement('option');o.value=o.textContent=e.subsystem;sel.appendChild(o)}
  }

  // Prune if too many
  if(allEntries.length>MAX_DOM+200){
    allEntries.splice(0,200);
    renderAll();
    return;
  }

  if(!matches(e))return;
  const idx=allEntries.length-1;
  visibleIndices.push(idx);

  document.getElementById('emptyState').style.display='none';
  container.appendChild(buildEntry(idx));
  document.getElementById('footerCount').textContent=visibleIndices.length+' lines';
  if(isPinned)scrollBottom();
}

// ── SSE (Server-Sent Events) for live tail ──
let evtSource=null;
function connectSSE(){
  if(evtSource){try{evtSource.close()}catch(e){}}
  try{
    evtSource=new EventSource('/data/logs/stream');
    evtSource.onopen=()=>{wsConnected=true;updateLive();document.getElementById('footerStatus').textContent='streaming'};
    evtSource.onmessage=(ev)=>{
      try{
        const entry=JSON.parse(ev.data);
        const ed=(entry.time||'').slice(0,10);
        const vd=dateInput.value||todayStr();
        if(ed===vd||!ed)appendEntry(entry);
      }catch(e){}
    };
    evtSource.onerror=()=>{
      wsConnected=false;updateLive();
      document.getElementById('footerStatus').textContent='reconnecting…';
    };
  }catch(e){setTimeout(connectSSE,3000)}
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown',(e)=>{
  const tag=document.activeElement.tagName;
  const inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(e.key==='Escape'){
    if(inInput){document.activeElement.blur();document.getElementById('searchInput').value='';applyFilters()}
    if(expandedEl){expandedEl.classList.remove('open');expandedEl.previousElementSibling?.classList.remove('expanded');expandedEl=null}
    return;
  }
  if(inInput)return;
  if(e.key==='f'){e.preventDefault();document.getElementById('searchInput').focus();return}
  if(e.key==='1'){toggleLevel('INFO',document.querySelector('[data-level="INFO"]'))}
  else if(e.key==='2'){toggleLevel('WARN',document.querySelector('[data-level="WARN"]'))}
  else if(e.key==='3'){toggleLevel('ERROR',document.querySelector('[data-level="ERROR"]'))}
  else if(e.key==='g'){scrollBottom()}
});

// ── Init ──
loadLogs();
connectSSE();
</script>
</body>
</html>
