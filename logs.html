<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Logs — OpenClaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --hull:#0a0c10;--panel:#0e1117;--shelf:#141820;--rack:#1a1f2a;
  --wire:rgba(255,255,255,.06);--wire-mid:rgba(255,255,255,.09);--wire-bright:rgba(255,255,255,.14);
  --ink:#e2e4e9;--ink-2:#9ca3af;--ink-3:#6b7280;--ink-4:#3d4452;
  --amber:#e5954a;--amber-dim:rgba(229,149,74,.5);--amber-glow:rgba(229,149,74,.08);
  --led-green:#4ade80;--led-yellow:#facc15;--led-red:#f87171;
  --green-dim:rgba(74,222,128,.15);--green-border:rgba(74,222,128,.3);
  --yellow-dim:rgba(250,204,21,.12);--yellow-border:rgba(250,204,21,.3);
  --red-dim:rgba(248,113,113,.12);--red-border:rgba(248,113,113,.3);
  --mono:'JetBrains Mono',monospace;
  --radius:3px;
  --gutter:3px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--mono);background:var(--hull);color:var(--ink);font-size:11px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Header ── */
.header{padding:0 16px;border-bottom:1px solid var(--wire);display:flex;align-items:center;justify-content:space-between;background:var(--panel);z-index:50;height:32px;flex-shrink:0}
.header h1{font-size:11px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.header .brand{color:var(--amber);font-weight:600}
.header .sep{color:var(--ink-4)}
.header nav{display:flex;gap:10px;font-size:10px;align-items:center}

/* ── Toolbar ── */
.toolbar{padding:0 12px;height:34px;border-bottom:1px solid var(--wire);display:flex;align-items:center;gap:0;background:var(--panel);flex-shrink:0}

/* Level toggles with embedded counts */
.level-toggle{display:flex;align-items:center;gap:0;height:22px;cursor:pointer;border:1px solid var(--wire);border-radius:2px;overflow:hidden;margin-right:2px;transition:border-color .12s,opacity .12s;opacity:.35;user-select:none}
.level-toggle:hover{opacity:.55}
.level-toggle.active{opacity:1}
.level-toggle .lt-label{padding:0 6px;font-size:8px;font-weight:700;letter-spacing:.4px;line-height:22px}
.level-toggle .lt-count{padding:0 5px;font-size:9px;font-weight:500;line-height:22px;border-left:1px solid var(--wire);font-variant-numeric:tabular-nums}

.lt-info{color:var(--led-green);border-color:var(--green-border)}
.lt-info.active{background:var(--green-dim);border-color:var(--green-border)}
.lt-info .lt-count{color:var(--led-green)}

.lt-warn{color:var(--led-yellow);border-color:var(--yellow-border)}
.lt-warn.active{background:var(--yellow-dim);border-color:var(--yellow-border)}
.lt-warn .lt-count{color:var(--led-yellow)}

.lt-error{color:var(--led-red);border-color:var(--red-border)}
.lt-error.active{background:var(--red-dim);border-color:var(--red-border)}
.lt-error .lt-count{color:var(--led-red)}

.tb-sep{width:1px;height:16px;background:var(--wire-mid);margin:0 8px;flex-shrink:0}

.tb-select{background:var(--hull);color:var(--ink-3);border:1px solid var(--wire);border-radius:2px;padding:2px 6px;font-family:var(--mono);font-size:9px;cursor:pointer;outline:none;height:22px}
.tb-select:hover{border-color:var(--wire-mid)}
.tb-select:focus{border-color:var(--amber-dim)}

.tb-search{background:var(--hull);color:var(--ink);border:1px solid var(--wire);border-radius:2px;padding:0 8px;font-family:var(--mono);font-size:9px;outline:none;height:22px;width:220px;transition:border-color .12s}
.tb-search::placeholder{color:var(--ink-4)}
.tb-search:focus{border-color:var(--amber);background:rgba(229,149,74,.03)}
.tb-search.has-error{border-color:var(--led-red);background:rgba(248,113,113,.03)}

.tb-date{background:var(--hull);color:var(--ink-3);border:1px solid var(--wire);border-radius:2px;padding:0 6px;font-family:var(--mono);font-size:9px;cursor:pointer;outline:none;height:22px;width:110px}
.tb-date:hover{border-color:var(--wire-mid)}
.tb-date:focus{border-color:var(--amber-dim)}

.tb-spacer{flex:1}

.pin-btn{background:transparent;border:1px solid var(--wire);border-radius:2px;color:var(--ink-4);height:22px;padding:0 8px;font-size:9px;cursor:pointer;font-family:var(--mono);transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.pin-btn:hover{color:var(--ink-2);border-color:var(--wire-mid)}
.pin-btn.pinned{color:var(--led-green);border-color:var(--green-border);background:var(--green-dim)}

.live-indicator{display:flex;align-items:center;gap:4px;margin-left:6px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--ink-4);flex-shrink:0}
.live-dot.on{background:var(--led-green);box-shadow:0 0 6px rgba(74,222,128,.5);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live-label{font-size:8px;font-weight:600;letter-spacing:.6px;color:var(--ink-4);text-transform:uppercase}
.live-dot.on+.live-label{color:var(--led-green)}

/* ── Log stream ── */
.stream{flex:1;overflow-y:auto;overflow-x:hidden}

/* Column header */
.col-header{display:grid;grid-template-columns:var(--gutter) 80px 48px 88px 1fr;gap:0;padding:0 0 0 0;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--wire)}
.col-header span{font-size:8px;color:var(--ink-4);font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:4px 8px}
.col-header .ch-gutter{padding:0}

/* Log row */
.log-entry{display:grid;grid-template-columns:var(--gutter) 80px 48px 88px 1fr;gap:0;border-bottom:1px solid rgba(255,255,255,.02);cursor:pointer;transition:background .06s}
.log-entry:hover{background:var(--shelf)}
.log-entry.expanded{background:var(--shelf)}

/* Severity gutter — the signature */
.entry-gutter{width:var(--gutter);min-height:100%}
.gutter-info{background:var(--led-green);opacity:.4}
.gutter-warn{background:var(--led-yellow);opacity:.6}
.gutter-error{background:var(--led-red);opacity:.8}
.log-entry:hover .gutter-info,.log-entry.expanded .gutter-info{opacity:.7}
.log-entry:hover .gutter-warn,.log-entry.expanded .gutter-warn{opacity:.9}
.log-entry:hover .gutter-error,.log-entry.expanded .gutter-error{opacity:1}

.entry-cell{padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;line-height:16px}
.entry-time{color:var(--ink-4);font-size:9px;font-variant-numeric:tabular-nums}
.entry-level{font-size:8px;font-weight:700;letter-spacing:.3px}
.lvl-info{color:var(--led-green)}
.lvl-warn{color:var(--led-yellow)}
.lvl-error{color:var(--led-red)}
.entry-subsys{color:var(--ink-4);font-size:9px}
.entry-msg{color:var(--ink-2);min-width:0}

/* Expand panel */
.expand-panel{display:none;border-bottom:1px solid var(--wire);background:var(--hull)}
.expand-panel.open{display:block}
.expand-panel pre{padding:10px 12px 10px calc(var(--gutter) + 12px);font-size:9px;line-height:1.5;color:var(--ink-3);white-space:pre-wrap;word-break:break-all;max-height:340px;overflow-y:auto}
.expand-panel pre .json-key{color:var(--amber)}
.expand-panel pre .json-str{color:var(--led-green);opacity:.7}
.expand-panel pre .json-num{color:var(--led-yellow);opacity:.8}
.expand-panel pre .json-bool{color:var(--led-red);opacity:.7}
.expand-panel pre .json-null{color:var(--ink-4)}

/* Empty state */
.empty{padding:60px 20px;text-align:center;color:var(--ink-4);font-size:10px;letter-spacing:.3px}
.empty .empty-icon{font-size:18px;margin-bottom:8px;opacity:.3}

/* Footer */
.footer{padding:0 16px;height:24px;font-size:9px;color:var(--ink-4);border-top:1px solid var(--wire);display:flex;align-items:center;justify-content:space-between;background:var(--panel);flex-shrink:0;font-variant-numeric:tabular-nums}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rack);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--wire-bright)}

@media(max-width:640px){
  .col-header,.log-entry{grid-template-columns:var(--gutter) 64px 40px 64px 1fr}
  .tb-search{width:120px}
}
</style>
</head>
<body>

<div class="header">
  <h1><span class="brand">OPENCLAW</span> <span class="sep">│</span> logs</h1>
  <nav>
    <a href="/">← sessions</a>
    <a href="/cron.html">cron</a>
    <a href="/system.html">sys</a>
  </nav>
</div>

<div class="toolbar">
  <div class="level-toggle lt-info active" data-level="INFO" onclick="toggleLevel('INFO',this)" title="Toggle INFO (1)">
    <span class="lt-label">INF</span><span class="lt-count" id="countInfo">0</span>
  </div>
  <div class="level-toggle lt-warn active" data-level="WARN" onclick="toggleLevel('WARN',this)" title="Toggle WARN (2)">
    <span class="lt-label">WRN</span><span class="lt-count" id="countWarn">0</span>
  </div>
  <div class="level-toggle lt-error active" data-level="ERROR" onclick="toggleLevel('ERROR',this)" title="Toggle ERROR (3)">
    <span class="lt-label">ERR</span><span class="lt-count" id="countError">0</span>
  </div>

  <div class="tb-sep"></div>

  <select class="tb-select" id="subsysSelect" onchange="applyFilters()" title="Subsystem">
    <option value="">all</option>
  </select>

  <div class="tb-sep"></div>

  <input class="tb-search" id="searchInput" type="text" placeholder="/regex or text…" title="Search (f)" oninput="applyFilters()">

  <div class="tb-sep"></div>

  <input class="tb-date" id="dateInput" type="date" title="Log date" onchange="loadLogs()">

  <div class="tb-spacer"></div>

  <button class="pin-btn pinned" id="pinBtn" onclick="togglePin()" title="Auto-scroll">
    <span>▼</span> TAIL
  </button>

  <div class="live-indicator">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-label" id="liveLabel">OFFLINE</span>
  </div>
</div>

<div class="stream" id="stream">
  <div class="col-header">
    <span class="ch-gutter"></span>
    <span>time</span>
    <span>level</span>
    <span>subsys</span>
    <span>message</span>
  </div>
  <div id="logContainer"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">◇</div>
    No logs matching filters
  </div>
</div>

<div class="footer">
  <span id="footerCount">0 lines</span>
  <span id="footerStatus">loading…</span>
</div>

<script>
// Live tail via SSE (works through HTTPS reverse proxies)
const MAX_DOM = 1500;

let allEntries = [];
let visibleIndices = [];
let activeLevels = new Set(['INFO','WARN','ERROR']);
let searchRegex = null;
let isPinned = true;
let wsConnected = false;
let expandedEl = null;

const dateInput = document.getElementById('dateInput');
const container = document.getElementById('logContainer');
const stream = document.getElementById('stream');

dateInput.value = todayStr();

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// ── Level toggles ──
function toggleLevel(level, el){
  if(activeLevels.has(level)){activeLevels.delete(level);el.classList.remove('active')}
  else{activeLevels.add(level);el.classList.add('active')}
  applyFilters();
}

function updateCounts(){
  let inf=0,wrn=0,err=0;
  for(const e of allEntries){
    if(e.level==='INFO')inf++;else if(e.level==='WARN')wrn++;else if(e.level==='ERROR')err++;
  }
  document.getElementById('countInfo').textContent=inf;
  document.getElementById('countWarn').textContent=wrn;
  document.getElementById('countError').textContent=err;
}

// ── Pin / tail ──
function togglePin(){
  isPinned=!isPinned;
  const btn=document.getElementById('pinBtn');
  btn.classList.toggle('pinned',isPinned);
  btn.innerHTML=isPinned?'<span>▼</span> TAIL':'<span>▽</span> PAUSED';
  if(isPinned)scrollBottom();
  updateLive();
}

function scrollBottom(){stream.scrollTop=stream.scrollHeight}

function updateLive(){
  const dot=document.getElementById('liveDot');
  const label=document.getElementById('liveLabel');
  if(wsConnected&&isPinned){dot.classList.add('on');label.textContent='LIVE'}
  else if(wsConnected){dot.classList.remove('on');label.textContent='CONNECTED'}
  else{dot.classList.remove('on');label.textContent='OFFLINE'}
}

// ── Filtering ──
function applyFilters(){
  const searchEl=document.getElementById('searchInput');
  const raw=searchEl.value;
  searchEl.classList.remove('has-error');
  searchRegex=null;
  if(raw){
    try{searchRegex=new RegExp(raw,'i')}
    catch(e){searchEl.classList.add('has-error')}
  }
  renderAll();
}

function matches(e){
  if(!activeLevels.has(e.level))return false;
  const sub=document.getElementById('subsysSelect').value;
  if(sub&&e.subsystem!==sub)return false;
  if(searchRegex){
    const hay=(e.message||'')+' '+(e.subsystem||'')+' '+(e.time||'');
    if(!searchRegex.test(hay))return false;
  }
  return true;
}

// ── Rendering ──
function renderAll(){
  container.innerHTML='';
  expandedEl=null;
  visibleIndices=[];
  for(let i=0;i<allEntries.length;i++){if(matches(allEntries[i]))visibleIndices.push(i)}
  const empty=document.getElementById('emptyState');
  if(!visibleIndices.length){empty.style.display='block';document.getElementById('footerCount').textContent='0 lines';return}
  empty.style.display='none';
  const frag=document.createDocumentFragment();
  for(const idx of visibleIndices)frag.appendChild(buildEntry(idx));
  container.appendChild(frag);
  document.getElementById('footerCount').textContent=visibleIndices.length+' lines';
  if(isPinned)scrollBottom();
}

function gutterClass(level){return level==='WARN'?'gutter-warn':level==='ERROR'?'gutter-error':'gutter-info'}
function levelClass(level){return level==='WARN'?'lvl-warn':level==='ERROR'?'lvl-error':'lvl-info'}

function fmtTime(t){
  if(!t)return '—';
  try{
    const d=new Date(t);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
  }catch(e){return t.slice(11,23)||t}
}

function buildEntry(idx){
  const e=allEntries[idx];
  const wrap=document.createElement('div');

  // Row
  const row=document.createElement('div');
  row.className='log-entry';
  row.dataset.idx=idx;

  const gutter=document.createElement('div');
  gutter.className='entry-gutter '+gutterClass(e.level);

  const time=document.createElement('div');
  time.className='entry-cell entry-time';
  time.textContent=fmtTime(e.time);

  const level=document.createElement('div');
  level.className='entry-cell entry-level '+levelClass(e.level);
  level.textContent=e.level==='ERROR'?'ERR':e.level==='WARN'?'WRN':'INF';

  const subsys=document.createElement('div');
  subsys.className='entry-cell entry-subsys';
  subsys.textContent=e.subsystem||'—';

  const msg=document.createElement('div');
  msg.className='entry-cell entry-msg';
  msg.textContent=e.message||'';

  row.append(gutter,time,level,subsys,msg);

  // Expand panel
  const panel=document.createElement('div');
  panel.className='expand-panel';
  const pre=document.createElement('pre');
  try{pre.innerHTML=syntaxHL(JSON.stringify(JSON.parse(e.raw),null,2))}
  catch(_){pre.textContent=e.raw||''}
  panel.appendChild(pre);

  row.addEventListener('click',()=>{
    if(expandedEl&&expandedEl!==panel){expandedEl.classList.remove('open');expandedEl.previousElementSibling?.classList.remove('expanded')}
    if(expandedEl===panel){panel.classList.remove('open');row.classList.remove('expanded');expandedEl=null}
    else{panel.classList.add('open');row.classList.add('expanded');expandedEl=panel}
  });

  wrap.append(row,panel);
  return wrap;
}

// Syntax highlight JSON
function syntaxHL(json){
  return json.replace(/("(?:[^"\\]|\\.)*")\s*:/g,'<span class="json-key">$1</span>:')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g,': <span class="json-str">$1</span>')
    .replace(/:\s*(\d+(?:\.\d+)?)/g,': <span class="json-num">$1</span>')
    .replace(/:\s*(true|false)/g,': <span class="json-bool">$1</span>')
    .replace(/:\s*(null)/g,': <span class="json-null">$1</span>');
}

// ── Subsystem dropdown ──
function rebuildSubsys(){
  const sel=document.getElementById('subsysSelect');
  const prev=sel.value;
  const subs=[...new Set(allEntries.map(e=>e.subsystem).filter(Boolean))].sort();
  sel.innerHTML='<option value="">all</option>'+subs.map(s=>`<option value="${s}"${s===prev?' selected':''}>${s}</option>`).join('');
}

// ── Load logs ──
async function loadLogs(){
  document.getElementById('footerStatus').textContent='loading…';
  const date=dateInput.value||todayStr();
  try{
    const r=await fetch(`/data/logs.json?date=${date}&limit=1500&offset=-1`);
    const d=await r.json();
    if(d.error){document.getElementById('footerStatus').textContent='error: '+d.error;return}
    allEntries=d.entries||[];
    updateCounts();
    rebuildSubsys();
    renderAll();
    document.getElementById('footerStatus').textContent=`${allEntries.length} of ${d.total} entries`;
    if(isPinned)scrollBottom();
  }catch(e){
    document.getElementById('footerStatus').textContent='fetch error';
    console.error(e);
  }
}

// ── Live tail (append) ──
function appendEntry(e){
  allEntries.push(e);
  updateCounts();

  // Update subsys dropdown
  if(e.subsystem){
    const sel=document.getElementById('subsysSelect');
    const opts=new Set(Array.from(sel.options).map(o=>o.value));
    if(!opts.has(e.subsystem)){const o=document.createElement('option');o.value=o.textContent=e.subsystem;sel.appendChild(o)}
  }

  // Prune if too many
  if(allEntries.length>MAX_DOM+200){
    allEntries.splice(0,200);
    renderAll();
    return;
  }

  if(!matches(e))return;
  const idx=allEntries.length-1;
  visibleIndices.push(idx);

  document.getElementById('emptyState').style.display='none';
  container.appendChild(buildEntry(idx));
  document.getElementById('footerCount').textContent=visibleIndices.length+' lines';
  if(isPinned)scrollBottom();
}

// ── SSE (Server-Sent Events) for live tail ──
let evtSource=null;
function connectSSE(){
  if(evtSource){try{evtSource.close()}catch(e){}}
  try{
    evtSource=new EventSource('/data/logs/stream');
    evtSource.onopen=()=>{wsConnected=true;updateLive();document.getElementById('footerStatus').textContent='streaming'};
    evtSource.onmessage=(ev)=>{
      try{
        const entry=JSON.parse(ev.data);
        const ed=(entry.time||'').slice(0,10);
        const vd=dateInput.value||todayStr();
        if(ed===vd||!ed)appendEntry(entry);
      }catch(e){}
    };
    evtSource.onerror=()=>{
      wsConnected=false;updateLive();
      document.getElementById('footerStatus').textContent='reconnecting…';
    };
  }catch(e){setTimeout(connectSSE,3000)}
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown',(e)=>{
  const tag=document.activeElement.tagName;
  const inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(e.key==='Escape'){
    if(inInput){document.activeElement.blur();document.getElementById('searchInput').value='';applyFilters()}
    if(expandedEl){expandedEl.classList.remove('open');expandedEl.previousElementSibling?.classList.remove('expanded');expandedEl=null}
    return;
  }
  if(inInput)return;
  if(e.key==='f'){e.preventDefault();document.getElementById('searchInput').focus();return}
  if(e.key==='1'){toggleLevel('INFO',document.querySelector('[data-level="INFO"]'))}
  else if(e.key==='2'){toggleLevel('WARN',document.querySelector('[data-level="WARN"]'))}
  else if(e.key==='3'){toggleLevel('ERROR',document.querySelector('[data-level="ERROR"]'))}
  else if(e.key==='g'){scrollBottom()}
});

// ── Init ──
loadLogs();
connectSSE();
</script>
</body>
</html>
