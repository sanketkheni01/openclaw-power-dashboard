<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Load — OpenClaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cozy-theme.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="/cozy-tailwind.js"></script>
<style>
html,body{height:100dvh}
body{display:flex;flex-direction:column;overflow:hidden;font-size:14px;line-height:1.5;font-family:'JetBrains Mono',ui-monospace,monospace}

/* Display family (Space Grotesk) for wordmark + card/section titles; JetBrains Mono for telemetry */
.cz-brand .cz-mark,.cz-brand .cz-page{font-family:var(--display)}

/* metrics grid */
.sys-main{flex:1;overflow-y:auto;padding:20px;scrollbar-gutter:stable}
.sys-grid{
  display:grid;gap:14px;max-width:1280px;margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
}
.card{
  background:var(--bg-primary);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 18px;
  display:flex;flex-direction:column;
}
.card.wide{grid-column:1/-1}
.card-title{
  font-family:var(--display);font-size:24px;font-weight:600;
  letter-spacing:-.01em;color:var(--text-secondary);
  margin-bottom:12px;display:flex;align-items:center;gap:7px;
}

.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
.metric+.bar-container{margin-top:-1px;margin-bottom:5px}
.metric-label{font-size:14px;color:var(--text-tertiary)}
.metric-value{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;font-weight:500;color:var(--text-primary);font-variant-numeric:tabular-nums;text-align:right}

.bar-container{height:4px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden;width:100%}
.bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.bar-green{background:var(--green)}
.bar-yellow{background:var(--yellow)}
.bar-red{background:var(--red)}

.process-table{width:100%;font-size:14px;border-collapse:collapse;font-family:'JetBrains Mono',ui-monospace,monospace}
.process-table th{
  text-align:left;color:var(--text-muted);font-weight:600;padding:5px 8px;
  border-bottom:1px solid var(--border);text-transform:uppercase;
  letter-spacing:.08em;font-size:11px;
}
.process-table td{padding:5px 8px;font-size:14px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;border-bottom:1px solid rgba(233,236,242,.03)}
.process-table tr:hover td{color:var(--text-secondary);background:var(--bg-secondary)}

.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

.footer{
  flex-shrink:0;min-height:40px;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg-primary);border-top:1px solid var(--border);
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;
}
</style>
</head>
<body>

<header class="cz-topbar">
  <div class="cz-brand">
    <span class="cz-led green live" id="statusDot"></span>
    <span class="cz-mark">OPENCLAW</span>
    <span class="cz-sep">/</span>
    <span class="cz-page">system</span>
  </div>
  <nav class="cz-nav">
    <a href="/">sessions</a>
    <a href="/cron.html">cron</a>
    <a href="/logs.html">logs</a>
    <a href="/keys">keys</a>
    <a href="/system.html" class="active">system</a>
    <span class="cz-pill cz-tnum" id="lastUpdate" style="margin-left:6px">—</span>
  </nav>
</header>

<div class="sys-main">
  <div class="sys-grid" id="dashboard">
    <div class="card" id="cpuCard">
      <div class="card-title"><span class="cz-led blue"></span>cpu</div>
      <div id="cpuMetrics"></div>
    </div>
    <div class="card" id="memCard">
      <div class="card-title"><span class="cz-led green"></span>memory</div>
      <div id="memMetrics"></div>
    </div>
    <div class="card" id="diskCard">
      <div class="card-title"><span class="cz-led yellow"></span>disk</div>
      <div id="diskMetrics"></div>
    </div>
    <div class="card" id="networkCard">
      <div class="card-title"><span class="cz-led blue"></span>network</div>
      <div id="networkMetrics"></div>
    </div>
    <div class="card" id="systemCard">
      <div class="card-title"><span class="cz-led muted"></span>host</div>
      <div id="systemMetrics"></div>
    </div>
    <div class="card" id="servicesCard">
      <div class="card-title"><span class="cz-led green"></span>services</div>
      <div id="servicesMetrics"></div>
    </div>
    <div class="card wide" id="processCard">
      <div class="card-title"><span class="cz-led muted"></span>top processes — by cpu</div>
      <table class="process-table">
        <thead><tr><th>pid</th><th>user</th><th>cpu%</th><th>mem%</th><th>rss</th><th>command</th></tr></thead>
        <tbody id="processTable"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">
  <span id="footerUpdate">connecting…</span>
  <span>auto-refresh · 5s</span>
</div>

<div class="cz-toasts" id="czToasts"></div>

<script>
function barColor(pct) {
  if (pct > 85) return 'bar-red';
  if (pct > 60) return 'bar-yellow';
  return 'bar-green';
}

function dotClass(pct) {
  if (pct > 85) return 'red';
  if (pct > 60) return 'yellow';
  return 'green live';
}

function bar(pct) {
  return `<div class="bar-container"><div class="bar-fill ${barColor(pct)}" style="width:${pct}%"></div></div>`;
}

function metric(label, value, pct) {
  return `<div class="metric">
    <span class="metric-label">${label}</span>
    <span class="metric-value">${value}</span>
  </div>${pct !== undefined ? bar(pct) : ''}`;
}

function toast(message, isError=false) {
  const c = document.getElementById('czToasts');
  const el = document.createElement('div');
  el.className = 'cz-toast ' + (isError ? 'error' : 'info');
  el.innerHTML = `<div class="cz-toast-icon">${isError ? '✗' : '●'}</div><div><div class="cz-toast-msg">${message}</div></div>`;
  c.appendChild(el);
  setTimeout(() => el.classList.add('show'), 16);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 220); }, 4500);
}

async function postAction(url, label, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try {
    const r = await fetch(url, {method: 'POST'});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    toast(`${label}: ${d.status || 'ok'}`);
    setTimeout(load, 1200);
  } catch (e) {
    toast(`${label} failed: ${e.message}`, true);
  }
}
function triggerGatewayFix(){ postAction('/api/fix-gateway', 'Gateway fix'); }
function startGatewayWatch(){ postAction('/api/start-gateway-watch', 'Gateway watch'); }
function restartGateway(){ postAction('/api/restart-gateway', 'Gateway restart', 'Restart OpenClaw gateway?'); }

async function load() {
  try {
    const r = await fetch('/data/system.json?t=' + Date.now());
    const d = await r.json();
    if (d.error) return;

    const cpu = d.cpu || {};
    document.getElementById('cpuMetrics').innerHTML =
      metric('usage', cpu.usage_pct + '%', cpu.usage_pct) +
      metric('load 1m / 5m / 15m', cpu.load_avg || '—') +
      metric('cores', cpu.cores || '—') +
      metric('model', cpu.model || '—');

    const mem = d.memory || {};
    document.getElementById('memMetrics').innerHTML =
      metric('used / total', `${mem.used} / ${mem.total}`, mem.used_pct) +
      metric('available', mem.available || '—') +
      metric('swap', `${mem.swap_used || '0'} / ${mem.swap_total || '0'}`, mem.swap_pct || 0);

    const disks = d.disks || [];
    document.getElementById('diskMetrics').innerHTML = disks.map(dk =>
      metric(`${dk.mount} (${dk.fs})`, `${dk.used} / ${dk.size}`, dk.used_pct)
    ).join('');

    const net = d.network || {};
    document.getElementById('networkMetrics').innerHTML =
      metric('rx', net.rx || '—') +
      metric('tx', net.tx || '—') +
      metric('connections', net.connections || '—');

    const sys = d.system || {};
    document.getElementById('systemMetrics').innerHTML =
      metric('hostname', sys.hostname || '—') +
      metric('uptime', sys.uptime || '—') +
      metric('kernel', sys.kernel || '—') +
      metric('processes', sys.processes || '—');

    const svcs = d.services || [];
    document.getElementById('servicesMetrics').innerHTML = svcs.map(s =>
      `<div class="metric">
        <span class="metric-label"><span class="cz-led ${s.active ? 'green' : 'red'}" style="margin-right:6px"></span>${s.name}</span>
        <span class="metric-value" style="color:${s.active ? 'var(--green)' : 'var(--red)'}">${s.status}</span>
      </div>`
    ).join('') + `<div class="action-row">
      <button class="cz-btn warn sm" onclick="triggerGatewayFix()">fix gateway</button>
      <button class="cz-btn sm" onclick="startGatewayWatch()">start watch</button>
      <button class="cz-btn danger sm" onclick="restartGateway()">restart gateway</button>
    </div>`;

    const procs = d.processes || [];
    document.getElementById('processTable').innerHTML = procs.map(p =>
      `<tr><td>${p.pid}</td><td>${p.user}</td><td>${p.cpu}</td><td>${p.mem}</td><td>${p.rss}</td><td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.cmd}</td></tr>`
    ).join('');

    const maxPct = Math.max(cpu.usage_pct || 0, mem.used_pct || 0);
    document.getElementById('statusDot').className = 'cz-led ' + dotClass(maxPct);

    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    document.getElementById('footerUpdate').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error(e);
  }
}

setInterval(load, 5000);
load();
</script>
</body>
</html>
